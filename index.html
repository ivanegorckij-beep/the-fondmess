<script>
const FM_KEY = 'fondmess.original.v2';

const FM_SEED = [
  {
    id: 'emma',
    name: 'Emma Wilson',
    emoji: '👩🏻‍🎨',
    avatar: 'https://randomuser.me/api/portraits/women/44.jpg',
    status: 'Online',
    messages: [
      { text: 'Hey! How are you?', mine: false, time: '12:04' }
    ]
  },
  {
    id: 'noah',
    name: 'Noah Parker',
    emoji: '🧑🏻‍💻',
    avatar: 'https://randomuser.me/api/portraits/men/32.jpg',
    status: 'Online',
    messages: [
      { text: 'Sent you a photo 📸', mine: false, time: '11:48' }
    ]
  },
  {
    id: 'sofia',
    name: 'Sofia Martinez',
    emoji: '👩🏻‍🦱',
    avatar: 'https://randomuser.me/api/portraits/women/68.jpg',
    status: 'Offline',
    messages: [
      { text: 'See you tomorrow!', mine: false, time: '10:21' }
    ]
  },
  {
    id: 'family',
    name: 'Family',
    emoji: '👨‍👩‍👧',
    avatar: 'https://randomuser.me/api/portraits/women/12.jpg',
    status: 'Group chat',
    messages: [
      { text: 'Mom: Great!', mine: false, time: 'Yesterday' }
    ]
  },
  {
    id: 'olivia',
    name: 'Olivia Davis',
    emoji: '🌻',
    avatar: 'https://randomuser.me/api/portraits/women/21.jpg',
    status: 'Offline',
    messages: [
      { text: 'Talk to you later', mine: false, time: 'Yesterday' }
    ]
  },
  {
    id: 'fondbot',
    name: 'FondBot',
    emoji: '🤖',
    avatar: '',
    status: '🤖 Always here',
    messages: [
      {
        text: 'Привет! Я FondBot 🤖 Напиши мне что-нибудь!',
        mine: false,
        time: 'Сейчас'
      }
    ]
  }
];

let fmChats = [];
let fmStories = [];
let fmCurrent = null;
let fmShowHistory = false;

function fmLoad() {
  try {
    const savedChats = localStorage.getItem(FM_KEY + ':chats');
    const savedStories = localStorage.getItem(FM_KEY + ':stories');

    fmChats = savedChats
      ? JSON.parse(savedChats)
      : JSON.parse(JSON.stringify(FM_SEED));

    fmStories = savedStories ? JSON.parse(savedStories) : [];

    if (!Array.isArray(fmChats)) {
      fmChats = JSON.parse(JSON.stringify(FM_SEED));
    }

    if (!Array.isArray(fmStories)) fmStories = [];

    // Бот всегда доступен
    if (!fmChats.some(c => c.id === 'fondbot')) {
      fmChats.push(JSON.parse(JSON.stringify(
        FM_SEED.find(c => c.id === 'fondbot')
      )));
    }

    fmChats.forEach(c => {
      if (!Array.isArray(c.messages)) c.messages = [];
    });
  } catch (e) {
    fmChats = JSON.parse(JSON.stringify(FM_SEED));
    fmStories = [];
  }
}

function fmSave() {
  try {
    localStorage.setItem(FM_KEY + ':chats', JSON.stringify(fmChats));
    localStorage.setItem(FM_KEY + ':stories', JSON.stringify(fmStories));
  } catch (e) {
    console.warn('FondMessages: не удалось сохранить данные.', e);
  }
}

function fmEsc(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[char]);
}

function fmTime() {
  return new Date().toLocaleTimeString([], {
    hour: '2-digit',
    minute: '2-digit'
  });
}

function fmLast(chat) {
  return chat.messages[chat.messages.length - 1];
}

function fmEnsureUI() {
  if (document.getElementById('fmChatOverlay')) return;

  document.body.insertAdjacentHTML('beforeend', `
    <div class="chat-overlay" id="fmChatOverlay">
      <section class="chat-window">
        <header class="chat-head">
          <button class="circle" id="fmBack" aria-label="Назад">‹</button>
          <img class="avatar" id="fmAvatar" alt="">
          <div class="details">
            <div class="name" id="fmName"></div>
            <div class="preview" id="fmStatus"></div>
          </div>
          <button class="circle" id="fmHistory" title="История сообщений">◷</button>
          <button class="circle" id="fmOptions" title="Настройки чата">···</button>
        </header>

        <div class="chat-messages" id="fmMessages"></div>

        <form class="chat-compose" id="fmCompose">
          <textarea id="fmInput" rows="1"
placeholder="Написать сообщение..."
            aria-label="Сообщение"></textarea>
          <button type="submit" aria-label="Отправить">➤</button>
        </form>
      </section>
    </div>

    <div class="chat-overlay" id="fmStoryOverlay">
      <section class="story-modal-card" id="fmStoryCard"></section>
    </div>
  `);

  const overlay = document.getElementById('fmChatOverlay');

  document.getElementById('fmBack').onclick = () => {
    overlay.classList.remove('open');
    fmCurrent = null;
  };

  overlay.onclick = event => {
    if (event.target === overlay) {
      overlay.classList.remove('open');
      fmCurrent = null;
    }
  };

  document.getElementById('fmStoryOverlay').onclick = event => {
    if (event.target.id === 'fmStoryOverlay') {
      event.currentTarget.classList.remove('open');
    }
  };

  document.getElementById('fmCompose').onsubmit = event => {
    event.preventDefault();
    fmSend(document.getElementById('fmInput').value);
  };

  document.getElementById('fmInput').onkeydown = event => {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      document.getElementById('fmCompose').requestSubmit();
    }
  };

  document.getElementById('fmHistory').onclick = () => {
    fmShowHistory = !fmShowHistory;
    fmRenderMessages();
  };

  document.getElementById('fmOptions').onclick = fmOptions;
}

function fmRenderList() {
  const list = document.getElementById('chats');
  if (!list) return;

  const search = document.getElementById('fmSearch');
  const query = search ? search.value.toLowerCase().trim() : '';

  list.replaceChildren();

  const filtered = fmChats.filter(chat => {
    const allMessages = chat.messages.map(m => m.text).join(' ');
    return (chat.name + ' ' + allMessages).toLowerCase().includes(query);
  });

  filtered.forEach(chat => {
    const item = document.createElement('article');
    item.className = 'chat';
    item.tabIndex = 0;
    item.setAttribute('role', 'button');

    const avatar = chat.avatar
      ? `<img class="avatar" src="${fmEsc(chat.avatar)}" alt="">`
      : `<div class="avatar" style="display:grid;place-items:center;font-size:25px">${fmEsc(chat.emoji || '💬')}</div>`;

    const last = fmLast(chat);

    item.innerHTML = `
      ${avatar}
      <div class="details">
        <div class="name">${fmEsc(chat.name)}</div>
        <div class="preview">${fmEsc(last ? last.text : 'Сообщений пока нет')}</div>
      </div>
      <div class="meta">
        <span>${fmEsc(last ? last.time : '')}</span>
      </div>
    `;

    item.onclick = () => fmOpen(chat.id);
    item.onkeydown = event => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        fmOpen(chat.id);
      }
    };

    list.appendChild(item);
  });

  if (!filtered.length) {
    const empty = document.createElement('p');
    empty.textContent = 'Чаты не найдены';
    empty.style.cssText = 'text-align:center;color:#8b98b0;padding:20px';
    list.appendChild(empty);
  }
}

function fmOpen(id) {
  const chat = fmChats.find(c => c.id === id);
  if (!chat) return;

  fmCurrent = id;
  fmShowHistory = false;
  fmEnsureUI();

  document.getElementById('fmName').textContent = chat.name;
  document.getElementById('fmStatus').textContent = chat.status || 'Чат';

  const avatar = document.getElementById('fmAvatar');
  avatar.src = chat.avatar || '';
  avatar.style.display = chat.avatar ? 'block' : 'none';

  fmRenderMessages();
  document.getElementById('fmChatOverlay').classList.add('open');
}

function fmRenderMessages() {
  const chat = fmChats.find(c => c.id === fmCurrent);
  if (!chat) return;

  const container = document.getElementById('fmMessages');
  const visible = fmShowHistory
    ? chat.messages
    : chat.messages.slice(-80);

  container.replaceChildren();

  const label = document.createElement('div');
  label.textContent = fmShowHistory
    ? 'История переписки'
    : 'Сообщения';

  label.style.cssText =
'text-align:center;color:#8b98b0;font-size:12px;padding:4px';

  container.appendChild(label);

  if (!visible.length) {
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Сообщений пока нет. Напиши первым 👋';
    container.appendChild(empty);
  }

  visible.forEach(message => {
    const bubble = document.createElement('div');
    bubble.className =
      'message-bubble ' + (message.mine ? 'mine' : 'theirs');

    bubble.appendChild(document.createTextNode(message.text));

    const time = document.createElement('small');
    time.textContent = message.time || '';
    bubble.appendChild(time);

    container.appendChild(bubble);
  });

  container.scrollTop = container.scrollHeight;

  const historyButton = document.getElementById('fmHistory');
  if (historyButton) historyButton.textContent = fmShowHistory ? '↩' : '◷';
}

function fmSend(text) {
  text = String(text || '').trim();
  if (!text || !fmCurrent) return;

  const chat = fmChats.find(c => c.id === fmCurrent);
  if (!chat) return;

  chat.messages.push({
    text,
    mine: true,
    time: fmTime()
  });

  fmSave();
  fmRenderMessages();
  fmRenderList();

  const input = document.getElementById('fmInput');
  input.value = '';
  input.focus();

  if (chat.id === 'fondbot') {
    setTimeout(() => {
      const reply = fmBotReply(text);

      chat.messages.push({
        text: reply,
        mine: false,
        time: fmTime()
      });

      fmSave();

      if (fmCurrent === chat.id) fmRenderMessages();
      fmRenderList();
    }, 500 + Math.random() * 500);
  }
}

function fmBotReply(text) {
  const value = text.toLowerCase();

  if (/привет|здравствуй|хай|ку\b/.test(value)) {
    return 'Привет! 😎 Рад тебя видеть!';
  }

  if (/как дела|как ты/.test(value)) {
    return 'У меня всё отлично! 🚀 А у тебя как дела?';
  }

  if (/спасибо/.test(value)) {
    return 'Всегда пожалуйста! 💙';
  }

  if (/время|который час/.test(value)) {
    return 'Сейчас ' + fmTime() + ' ⏰';
  }

  if (/помощь|команды/.test(value)) {
    return 'Я FondBot 🤖 Можешь спросить время, поздороваться или просто поболтать!';
  }

  if (/кто ты|твоё имя|твое имя/.test(value)) {
    return 'Я FondBot — помощник внутри FondMessages! 🤖';
  }

  const replies = [
    'Интересно! Расскажи подробнее 😊',
    'Я тебя услышал! 💙',
    'Хорошо 😎 Что ещё интересного?',
    'Я FondBot, и я всегда готов поболтать! 🤖',
    'Понял тебя ✨'
  ];

  return replies[Math.floor(Math.random() * replies.length)];
}

function fmPrompt(title, placeholder, callback, initial = '') {
  const card = document.getElementById('fmStoryCard');

  card.innerHTML = `
    <h2>${fmEsc(title)}</h2>
    <input id="fmPromptValue"
      maxlength="180"
      placeholder="${fmEsc(placeholder)}"
      value="${fmEsc(initial)}">
    <div class="story-actions">
      <button class="filter" id="fmCancel">Отмена</button>
      <button class="filter" id="fmConfirm">Сохранить</button>
    </div>
  `;

  const overlay = document.getElementById('fmStoryOverlay');
  overlay.classList.add('open');

  const input = document.getElementById('fmPromptValue');
  input.focus();

  const close = () => overlay.classList.remove('open');

  document.getElementById('fmCancel').onclick = close;

  document.getElementById('fmConfirm').onclick = () => {
    const value = input.value.trim();
    if (!value) {
      input.focus();
      return;
    }

    callback(value);
    close();
  };

  input.onkeydown = event => {
    if (event.key === 'Enter') {
      event.preventDefault();
      document.getElementById('fmConfirm').click();
    }
  };
}

function fmNewChat() {
  fmPrompt('Новый чат', 'Имя собеседника или группы', name => {
    const chat = {
      id: 'chat_' + Date.now(),
      name,
      emoji: '💬',
      avatar: '',
      status: 'Новый чат',
      messages: []
    };

    fmChats.unshift(chat);
    fmSave();
    fmRenderList();
    fmOpen(chat.id);
  });
}

function fmAddStory() {
fmPrompt('Добавить историю', 'Что хочешь рассказать?', text => {
    fmStories.unshift({
      id: 'story_' + Date.now(),
      name: 'Твоя история',
      text,
      emoji: '✨',
      time: Date.now()
    });

    fmSave();
    fmRenderStories();
  });
}

function fmRenderStories() {
  const section = document.querySelector('.stories');
  if (!section) return;

  section.replaceChildren();

  const own = document.createElement('div');
  own.className = 'story';
  own.innerHTML = '<div class="add">＋</div><span>Твоя история</span>';
  own.onclick = fmAddStory;
  section.appendChild(own);

  const defaults = [
    { name: 'Emma', emoji: '🌸', text: 'Hey! 👋' },
    { name: 'Noah', emoji: '📸', text: 'Новый день!' },
    { name: 'Sofia', emoji: '🌅', text: 'Хорошего дня ✨' },
    { name: 'Liam', emoji: '😎', text: 'Всё отлично!' }
  ];

  defaults.forEach((story, index) => {
    const item = document.createElement('div');
    item.className = 'story';

    const art = document.createElement('div');
    art.className = 'add';
    art.style.background = [
      'linear-gradient(145deg,#ff9a9e,#fad0c4)',
      'linear-gradient(145deg,#84fab0,#8fd3f4)',
      'linear-gradient(145deg,#a18cd1,#fbc2eb)',
      'linear-gradient(145deg,#667eea,#764ba2)'
    ][index];

    art.textContent = story.emoji;

    const name = document.createElement('span');
    name.textContent = story.name;

    item.append(art, name);
    item.onclick = () => fmShowDefaultStory(story);
    section.appendChild(item);
  });

  fmStories.forEach(story => {
    const item = document.createElement('div');
    item.className = 'story';

    const art = document.createElement('div');
    art.className = 'add';
    art.textContent = story.emoji || '✨';

    const name = document.createElement('span');
    name.textContent = story.name || 'История';

    item.append(art, name);
    item.onclick = () => fmViewStory(story.id);

    section.appendChild(item);
  });
}

function fmShowDefaultStory(story) {
  const card = document.getElementById('fmStoryCard');

  card.innerHTML = `
    <div class="section-head">
      <h2>${fmEsc(story.name)}</h2>
      <button class="circle" id="fmStoryClose">×</button>
    </div>
    <div class="story-art">${fmEsc(story.emoji)}</div>
    <p>${fmEsc(story.text)}</p>
  `;

  document.getElementById('fmStoryOverlay').classList.add('open');
  document.getElementById('fmStoryClose').onclick = () => {
    document.getElementById('fmStoryOverlay').classList.remove('open');
  };
}

function fmViewStory(id) {
  const story = fmStories.find(s => s.id === id);
  if (!story) return;

  const card = document.getElementById('fmStoryCard');

  card.innerHTML = `
    <div class="section-head">
      <h2>${fmEsc(story.name)}</h2>
      <button class="circle" id="fmStoryClose">×</button>
    </div>
    <div class="story-art">${fmEsc(story.emoji || '✨')}</div>
    <p>${fmEsc(story.text)}</p>
    <div class="story-actions">
      <button class="filter" id="fmStoryDelete">Удалить</button>
    </div>
  `;

  const overlay = document.getElementById('fmStoryOverlay');
  overlay.classList.add('open');

  document.getElementById('fmStoryClose').onclick = () => {
    overlay.classList.remove('open');
  };

  document.getElementById('fmStoryDelete').onclick = () => {
    fmStories = fmStories.filter(s => s.id !== id);
    fmSave();
    fmRenderStories();
    overlay.classList.remove('open');
  };
}

function fmOptions() {
  const chat = fmChats.find(c => c.id === fmCurrent);
  if (!chat) return;

  const card = document.getElementById('fmStoryCard');

  card.innerHTML = `
    <h2>${fmEsc(chat.name)}</h2>
    <p>Настройки чата</p>
    <button class="filter" style="width:100%;margin:5px 0" id="fmRename">Переименовать</button>
    <button class="filter" style="width:100%;margin:5px 0" id="fmExport">Скачать переписку</button>
    <button class="filter" style="width:100%;margin:5px 0" id="fmDelete">Удалить чат</button>
    <div class="story-actions">
<button class="filter" id="fmOptionsClose">Закрыть</button>
    </div>
  `;

  const overlay = document.getElementById('fmStoryOverlay');
  overlay.classList.add('open');

  document.getElementById('fmOptionsClose').onclick = () => {
    overlay.classList.remove('open');
  };

  document.getElementById('fmRename').onclick = () => {
    overlay.classList.remove('open');

    fmPrompt('Переименовать чат', 'Новое имя', name => {
      chat.name = name;
      fmSave();
      fmRenderList();
      fmOpen(chat.id);
    }, chat.name);
  };

  document.getElementById('fmExport').onclick = () => {
    const content = chat.messages.map(message =>
      `[${message.time || ''}] ${message.mine ? 'Ты' : chat.name}: ${message.text}`
    ).join('\n');

    const blob = new Blob([content], {
      type: 'text/plain;charset=utf-8'
    });

    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');

    link.href = url;
    link.download = 'FondMessages-history.txt';
    link.click();

    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  document.getElementById('fmDelete').onclick = () => {
    if (chat.id === 'fondbot') {
      alert('FondBot нельзя удалить 🤖');
      return;
    }

    if (!confirm('Удалить этот чат и переписку?')) return;

    fmChats = fmChats.filter(c => c.id !== chat.id);
    fmSave();
    fmRenderList();

    overlay.classList.remove('open');
    document.getElementById('fmChatOverlay').classList.remove('open');
    fmCurrent = null;
  };
}

function searchChats() {
  fmEnsureUI();

  fmPrompt('Поиск чатов', 'Имя или текст сообщения', query => {
    const chat = fmChats.find(c =>
      (c.name + ' ' + c.messages.map(m => m.text).join(' '))
        .toLowerCase()
        .includes(query.toLowerCase())
    );

    if (chat) {
      fmOpen(chat.id);
    } else {
      alert('Ничего не найдено');
    }
  });
}

function showTab(button, name) {
  document.querySelectorAll('.nav button').forEach(item => {
    item.classList.remove('active');
  });

  button.classList.add('active');

  if (name === 'Chats') {
    fmRenderList();
  } else if (name === 'Friends') {
    fmNewChat();
  } else if (name === 'Calls') {
    fmPrompt('Звонки', 'Звонки пока не подключены', () => {});
  } else if (name === 'Profile') {
    fmPrompt(
      'Твой профиль',
      'Как тебя называть?',
      value => localStorage.setItem('fondmess.displayName', value),
      localStorage.getItem('fondmess.displayName') || 'Ты'
    );
  }
}

document.addEventListener('DOMContentLoaded', () => {
  fmLoad();
  fmEnsureUI();
  fmRenderList();
  fmRenderStories();

  const searchButton = document.querySelector('.circle[aria-label="Search"]');
  if (searchButton) searchButton.onclick = searchChats;

  document.querySelectorAll('.filter').forEach(button => {
    if (button.textContent.includes('Add')) {
      button.onclick = fmAddStory;
    }
  });

  document.querySelectorAll('.nav button').forEach(button => {
    const match = button.getAttribute('onclick')?.match(
      /showTab\(this,'([^']+)'/
    );

    if (match) {
      button.onclick = () => showTab(button, match[1]);
    }
  });

  // Быстрое создание чата через заголовок раздела
  const headings = document.querySelectorAll('.section-head');
  headings.forEach(head => {
    const title = head.querySelector('h2');
    const button = head.querySelector('button');

    if (title && title.textContent.trim() === 'Messages' && button) {
      button.textContent = '＋ Чат';
      button.onclick = fmNewChat;
    }

    if (title && title.textContent.trim() === 'Stories' && button) {
      button.onclick = fmAddStory;
    }
  });
});
</script>
