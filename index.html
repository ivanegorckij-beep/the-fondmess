<style>
*{box-sizing:border-box}
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#15213a;background:#f6f8fc;font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body{margin:0;min-height:100vh}
button{font:inherit;cursor:pointer;border:0}
.app{max-width:520px;min-height:100vh;margin:auto;padding:22px 18px 110px;background:linear-gradient(160deg,#fff,#f5f8ff 65%,#edf4ff)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0 28px;width:100%}.brand-wrap{flex:1;min-width:0;display:flex;align-items:center;gap:10px}.brand-wrap::before{content:none;display:none}.brand{font-size:clamp(27px,7vw,32px);font-weight:950;letter-spacing:-1.45px;line-height:1.02;white-space:nowrap;width:100%;font-stretch:expanded;-webkit-text-stroke:.35px currentColor}
.brand{font-size:clamp(27px,7vw,32px);font-weight:950;letter-spacing:-1.45px;text-shadow:0 4px 5px rgba(21,33,58,.20),0 9px 18px rgba(21,33,58,.13),0 1px 1px rgba(21,33,58,.12)}
.sub{color:#8b98b0;font-size:13px;font-weight:750;letter-spacing:.15px;margin-bottom:4px}
.circle{width:44px;height:44px;flex:none;border-radius:50%;background:#fff;box-shadow:0 8px 22px rgba(35,57,91,.18),0 3px 7px rgba(35,57,91,.09);color:#2563eb;font-size:22px}

.stories{display:flex;gap:13px;overflow-x:auto;padding:2px 1px 8px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{flex:0 0 76px;text-align:center;font-size:12px;font-weight:650;color:#687894;white-space:nowrap}
.story img{width:72px;height:86px;object-fit:cover;border-radius:10px;display:block;margin-bottom:8px;background:#e3ebf8;box-shadow:0 8px 20px rgba(34,54,88,.23),0 3px 7px rgba(34,54,88,.12)}
.story .add{height:86px;border-radius:10px;background:linear-gradient(145deg,#e5efff,#cbdfff);display:grid;place-items:center;color:#2878f5;font-size:31px;margin-bottom:8px;box-shadow:0 8px 21px rgba(40,120,245,.28),0 3px 7px rgba(40,120,245,.14)}

.meta{display:flex;flex-direction:column;align-items:flex-end;gap:8px;color:#98a4b8;font-size:11px;font-weight:650}
.unread{min-width:20px;height:20px;border-radius:12px;background:#2878f5;color:white;display:grid;place-items:center;font-size:11px;font-weight:900;padding:0 5px;box-shadow:0 5px 13px rgba(40,120,245,.38)}
.nav{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:min(484px,calc(100% - 28px));display:flex;justify-content:space-around;align-items:center;padding:11px 8px calc(11px + env(safe-area-inset-bottom));border:1px solid #ffffffd9;border-radius:27px;background:#ffffffd9;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 16px 42px rgba(38,59,97,.22),0 5px 13px rgba(38,59,97,.10)}

.nav .ico{width:24px;height:24px;display:grid;place-items:center}.nav .ico svg{width:23px;height:23px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .active{color:#2878f5;font-weight:900;text-shadow:0 2px 12px rgba(40,120,245,.28)}
button:active{transform:scale(.96)}

/* FondMess motion layer: subtle, iOS-inspired and respectful of reduced-motion settings */
.app{animation:app-enter .72s cubic-bezier(.2,.75,.25,1) both}
.top,.section-head,.stories{animation:content-enter .65s cubic-bezier(.2,.75,.25,1) both}
.top{animation-delay:.04s}
.stories{animation-delay:.10s}
#chats .chat{animation:chat-enter .55s cubic-bezier(.2,.75,.25,1) both}
#chats .chat:nth-child(1){animation-delay:.08s}
#chats .chat:nth-child(2){animation-delay:.14s}
#chats .chat:nth-child(3){animation-delay:.20s}
#chats .chat:nth-child(4){animation-delay:.26s}
#chats .chat:nth-child(5){animation-delay:.32s}
.story{transition:transform .28s cubic-bezier(.2,.8,.2,1),filter .28s ease}
.story img,.story .add{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .3s ease,filter .3s ease}.story .add{border-radius:10px}
.story:active{transform:scale(.96)}
.story:active img,.story:active .add{transform:scale(.97);filter:saturate(1.08)}
.chat{will-change:transform,box-shadow}
.chat:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(37,56,88,.17),0 3px 8px rgba(37,56,88,.08)}
.chat:active{transform:scale(.985);box-shadow:0 4px 12px rgba(37,56,88,.12)}
.circle,.filter,.nav button{transition:transform .22s cubic-bezier(.2,.8,.2,1),background .22s ease,color .22s ease,box-shadow .22s ease}
.circle:active,.filter:active{transform:scale(.93)}
.nav{isolation:isolate;animation:nav-enter .7s .22s cubic-bezier(.2,.75,.25,1) both}
.nav::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.7),rgba(255,255,255,.12) 42%,rgba(210,226,255,.22));z-index:-1}
.nav button{position:relative;padding:2px 5px;border-radius:16px}
.nav button:active{transform:scale(.91)}
.nav .ico{transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.nav button.active .ico{transform:translateY(-2px) scale(1.08)}
.online-dot{animation:online-pulse 2.4s ease-in-out infinite}
.unread{animation:badge-pop .45s .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes app-enter{from{opacity:0;transform:translateY(12px) scale(.992)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes content-enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

@keyframes nav-enter{from{opacity:0;transform:translate(-50%,14px) scale(.97)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@keyframes badge-pop{0%{opacity:0;transform:scale(.65)}70%{transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes online-pulse{0%,100%{box-shadow:0 0 0 0 rgba(36,200,117,0)}50%{box-shadow:0 0 0 4px rgba(36,200,117,.12)}}
@media (hover:none){.chat:hover{transform:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
}

/* Refined iOS-style interaction: subtle tap, then a soft spring on hold */
:root{--fm-spring:cubic-bezier(.2,.85,.25,1.18)}
.chat,.story,.circle,.filter,.nav button,.chat-compose button,.story-modal-card button{
  transform-origin:center;
  transition:transform .34s var(--fm-spring),box-shadow .3s ease,background-color .24s ease,filter .24s ease;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
/* Pressing a chat visibly zooms it forward, like the reference interaction. */
.chat.fm-pressed{transform:scale(1.045);z-index:3;box-shadow:0 16px 34px rgba(25,43,75,.22),0 5px 12px rgba(25,43,75,.1);transition-duration:.16s}
.story.fm-pressed{transform:scale(1.055);z-index:3;filter:saturate(1.08);transition-duration:.16s}
.circle.fm-pressed,.filter.fm-pressed,.nav button.fm-pressed,.chat-compose button.fm-pressed,.story-modal-card button.fm-pressed{transform:scale(.96);transition-duration:.12s}
/* If the finger stays down, the card gently grows a little more. */
.chat.fm-hold{transform:scale(1.075);z-index:4;box-shadow:0 20px 42px rgba(25,43,75,.25),0 6px 15px rgba(25,43,75,.12)}
.story.fm-hold{transform:scale(1.075);z-index:4;filter:saturate(1.1)}
.circle.fm-hold,.filter.fm-hold,.story-modal-card button.fm-hold{transform:scale(1.045);box-shadow:0 8px 19px rgba(40,120,245,.2)}
.nav button.fm-hold{transform:scale(1.035);background:rgba(40,120,245,.07)}
.nav button.fm-hold .ico{transform:scale(1.06)}
.chat-compose button.fm-hold{transform:scale(1.045);box-shadow:0 7px 17px rgba(40,120,245,.3)}
.story.fm-hold img,.story.fm-hold .add{transform:scale(1.06);box-shadow:0 12px 25px rgba(40,120,245,.24)}
@media(hover:hover){.chat:hover{transform:translateY(-1px)}}
@media(prefers-reduced-motion:reduce){.chat,.story,.circle,.filter,.nav button,.chat-compose button,.story-modal-card button{transition:none!important}}

.fm-particles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;contain:strict}

<body>
<main class="app">
  <header class="top">
    <div class="fm-top-switch" role="tablist" aria-label="Раздел">
      <button class="active" id="fmTabChats" onclick="fmSwitchTop('chats')">Чаты</button>
      <button id="fmTabPosts" onclick="fmSwitchTop('posts')">Посты</button>
    </div>
    <div class="brand-wrap"><div class="brand">FondMessages</div></div>
    <button class="circle" aria-label="Search" onclick="searchChats()">⌕</button>
  </header>
  <div class="section-head"><h2 style="margin-top:0">Stories</h2><button class="filter" onclick="alert('Stories will be available when we connect the backend.')">＋ Add</button></div>
  <section class="stories" id="fmStoriesList">
    <div class="story"><div class="add">＋</div>Your story</div>
  </section>
  <div class="section-head"><h2>Messages</h2><button class="filter" onclick="searchChats()">⌕ Search</button></div>
  <section id="chats" aria-live="polite"></section>
  <section id="fmPostsPanel" aria-label="Публикации">
    <h2 style="margin-top:8px">Лента</h2>
    <div class="post-composer"><textarea id="fmPostText" maxlength="280" placeholder="Что нового?"></textarea><div class="post-actions"><span>До 280 символов</span><button onclick="fmPublishPost()">Опубликовать</button></div></div>
    <div class="fm-cloud-note" id="fmPostsNote">Публикации будут видны вошедшим пользователям.</div>
    <div id="fmPostsList"></div>
  </section>
</main>
<div class="fm-particles" id="fmParticles" aria-hidden="true"></div>
<nav class="nav" aria-label="Основная навигация">
  <button onclick="showTab(this,'Profile')"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20c.5-4 3.2-6.2 7.5-6.2s7 2.2 7.5 6.2"/></svg></span>Профиль</button>
  <button onclick="showTab(this,'Friends')"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.3"/><path d="M2.8 19c.4-3.1 2.7-5 6.2-5s5.8 1.9 6.2 5M16 5.2a3.1 3.1 0 0 1 0 5.8M17 14.2c2.4.5 3.8 2.1 4.1 4.8"/></svg></span>Друзья</button>
  <button onclick="showTab(this,'Calls')"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.8 10 3l2 4.8-2.2 1.7a15 15 0 0 0 4.7 4.7l1.7-2.2 4.8 2-.8 3c-.4 1.3-1.7 2.1-3.1 1.8A18.7 18.7 0 0 1 5.2 8.9C4.9 7.5 5.7 4.2 7 3.8Z"/></svg></span>Звонки</button>
</nav>
<script>


function fmSwitchTop(tab){const posts=tab==='posts';document.getElementById('chats').style.display=posts?'none':'';document.getElementById('fmPostsPanel').style.display=posts?'block':'none';document.getElementById('fmTabChats').classList.toggle('active',!posts);document.getElementById('fmTabPosts').classList.toggle('active',posts);const storiesHead=document.querySelector('.section-head');if(storiesHead)storiesHead.style.display=posts?'none':'';document.querySelector('.stories').style.display=posts?'none':'';if(posts)fmLoadPosts()}
function fmMakeParticles(){const layer=document.getElementById('fmParticles');if(!layer||layer.childElementCount)return;for(let i=0;i<7;i++){const dot=document.createElement('i');const w=Math.round(95+Math.random()*55),h=Math.round(75+Math.random()*55);const shapes=['57% 43% 66% 34% / 43% 57% 39% 61%','38% 62% 48% 52% / 59% 36% 64% 41%','63% 37% 41% 59% / 46% 58% 42% 54%'];dot.style.cssText=`left:${Math.random()*94}%;top:${Math.random()*92}%;width:${w}px;height:${h}px;border-radius:${shapes[i%shapes.length]};--dur:${18+Math.random()*10}s;--op:${(.28+Math.random()*.22).toFixed(2)};animation-delay:-${Math.random()*7}s`;layer.appendChild(dot)}}
async function fmLoadPosts(){const list=document.getElementById('fmPostsList'),note=document.getElementById('fmPostsNote');if(!window.fmDb){list.innerHTML='<div class="fm-cloud-note">Подключение к Supabase ещё запускается…</div>';return}const {data,error}=await fmDb.from('posts').select('id,user_id,content,created_at').order('created_at',{ascending:false}).limit(50);if(error){list.innerHTML='';note.textContent='Для ленты нужно создать таблицу posts в Supabase. Подробности ниже в чате.';return}if(!data?.length){list.innerHTML='<div class="fm-cloud-note">Пока нет публикаций. Будь первым!</div>';return}let profileMap={};const ids=[...new Set(data.map(p=>p.user_id))];const {data:profiles}=await fmDb.from('profiles').select('id,username,display_name').in('id',ids);(profiles||[]).forEach(p=>profileMap[p.id]=p);list.innerHTML=data.map(p=>{const user=profileMap[p.user_id]||{};return `<article class="post-card"><div><span class="post-author">${fmEsc(user.display_name||'Пользователь')}</span><span class="post-time">@${fmEsc(user.username||'user')} · ${new Date(p.created_at).toLocaleDateString()}</span></div><div class="post-text">${fmEsc(p.content)}</div></article>`}).join('')}
async function fmPublishPost(){const box=document.getElementById('fmPostText'),content=box.value.trim();if(!content)return;if(!window.fmUser){fmNotice('Войди в аккаунт, чтобы публиковать посты.');return}const {error}=await fmDb.from('posts').insert({user_id:fmUser.id,content});if(error){fmNotice('Не удалось опубликовать: '+error.message+' — проверь таблицу posts в Supabase.');return}box.value='';await fmLoadPosts()}
const FM_KEY='fondmess.original.v1';
const FM_SEED=[{id:'fondbot',name:'FondBot',emoji:'🤖',avatar:'',status:'Always here',messages:[{text:'Привет! Я FondBot 🤖 Можешь написать мне или добавить человека в контакты.',mine:false,time:'Сейчас'}]}];
let fmChats=[],fmStories=[],fmCurrent=null,fmShowHistory=false;
function fmLoad(){try{const saved=JSON.parse(localStorage.getItem(FM_KEY+'chats'));fmChats=Array.isArray(saved)?saved.filter(c=>c.id==='fondbot'||c.isContact):JSON.parse(JSON.stringify(FM_SEED));fmStories=JSON.parse(localStorage.getItem(FM_KEY+'stories'))||[]}catch(e){fmChats=JSON.parse(JSON.stringify(FM_SEED));fmStories=[]}if(!fmChats.some(c=>c.id==='fondbot'))fmChats.unshift(JSON.parse(JSON.stringify(FM_SEED[0])));fmStories=fmStories.filter(x=>x.isMine);fmSave()}
function fmSave(){try{localStorage.setItem(FM_KEY+'chats',JSON.stringify(fmChats));localStorage.setItem(FM_KEY+'stories',JSON.stringify(fmStories))}catch(e){}}
function fmEsc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmTime(){return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
function fmLast(c){return c.messages[c.messages.length-1]}
function fmEnsureUI(){if(document.getElementById('fmChatOverlay'))return;document.body.insertAdjacentHTML('beforeend',`<div class="chat-overlay" id="fmChatOverlay"><section class="chat-window"><header class="chat-head"><button class="circle" id="fmBack" aria-label="Back"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="m15 18-6-6 6-6"/></svg></button><img class="avatar" id="fmAvatar" alt=""><div class="details"><div class="name" id="fmName"></div><div class="preview" id="fmStatus"></div></div><button class="circle" id="fmHistory" title="View history" aria-label="Chat history"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="8.5"/><path d="M12 6.8v5.5l3.5 2"/></svg></button><button class="circle" id="fmOptions" title="Chat options" aria-label="Chat options"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill:currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button></header><div class="chat-messages" id="fmMessages"></div><form class="chat-compose" id="fmCompose"><textarea id="fmInput" rows="1" placeholder="Write a message..." aria-label="Message"></textarea><button aria-label="Send"><svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true" style="fill:currentColor"><path d="M2.8 20.2 22 12 2.8 3.8l.1 6.4 13.3 1.8-13.3 1.8z"/></svg></button></form></section></div><div class="chat-overlay" id="fmStoryOverlay"><section class="story-modal-card" id="fmStoryCard"></section></div>`);document.getElementById('fmBack').onclick=()=>document.getElementById('fmChatOverlay').classList.remove('open');document.getElementById('fmChatOverlay').onclick=e=>{if(e.target.id==='fmChatOverlay')e.currentTarget.classList.remove('open')};document.getElementById('fmStoryOverlay').onclick=e=>{if(e.target.id==='fmStoryOverlay')e.currentTarget.classList.remove('open')};document.getElementById('fmCompose').onsubmit=e=>{e.preventDefault();fmSend(document.getElementById('fmInput').value)};document.getElementById('fmInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('fmCompose').requestSubmit()}};document.getElementById('fmHistory').onclick=()=>{fmShowHistory=!fmShowHistory;fmRenderMessages()};document.getElementById('fmOptions').onclick=fmOptions}
function fmRenderList(){const q=(document.getElementById('fmSearch')?.value||'').toLowerCase(),list=document.getElementById('chats');if(!list)return;list.innerHTML='';const visible=fmChats.filter(c=>(c.name+' '+(fmLast(c)?.text||'')).toLowerCase().includes(q));if(!visible.length){list.innerHTML='<div style="padding:28px 12px;text-align:center;color:#8290a8">Пока нет чатов. Добавь контакт через раздел Friends.</div>';return}visible.forEach(c=>{const a=document.createElement('article');a.className='chat';a.tabIndex=0;a.setAttribute('role','button');const av=c.avatar?`<img class="avatar" src="${fmEsc(c.avatar)}" alt="">`:`<div class="avatar" style="display:grid;place-items:center;font-size:25px">${fmEsc(c.emoji)}</div>`;a.innerHTML=`${av}<div class="details"><div class="name">${fmEsc(c.name)}</div><div class="preview">${fmEsc(fmLast(c)?.text||'No messages yet')}</div></div><div class="meta"><span>${fmEsc(fmLast(c)?.time||'')}</span></div>`;a.onclick=()=>fmOpen(c.id);a.onkeydown=e=>{if(e.key==='Enter'){fmOpen(c.id)}};list.appendChild(a)})}
function fmOpen(id){fmCurrent=id;fmShowHistory=false;const c=fmChats.find(x=>x.id===id);if(!c)return;fmEnsureUI();document.getElementById('fmName').textContent=c.name;document.getElementById('fmStatus').textContent=c.status||'Chat';const av=document.getElementById('fmAvatar');av.src=c.avatar||'';av.style.display=c.avatar?'block':'none';fmRenderMessages();document.getElementById('fmChatOverlay').classList.add('open')}
function fmRenderMessages(){const c=fmChats.find(x=>x.id===fmCurrent);if(!c)return;const el=document.getElementById('fmMessages'),msgs=fmShowHistory?c.messages:c.messages.slice(-80);el.innerHTML=`<div class="day-label">${fmShowHistory?'Full chat history':'Messages'}</div>`+(msgs.length?msgs.map(m=>`<div class="message-bubble ${m.mine?'mine':'theirs'}">${fmEsc(m.text)}<small>${fmEsc(m.time||'')}</small></div>`).join(''):'<div class="empty">No messages yet. Say hello 👋</div>');el.scrollTop=el.scrollHeight;document.getElementById('fmHistory').innerHTML=fmShowHistory?'<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a6 6 0 1 1-5.5 8.4"/></svg>':'<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><circle cx="12" cy="12" r="8.5"/><path d="M12 6.8v5.5l3.5 2"/></svg>'}
function fmSend(text){text=text.trim();if(!text||!fmCurrent)return;const c=fmChats.find(x=>x.id===fmCurrent);c.messages.push({text,mine:true,time:fmTime()});fmSave();fmRenderMessages();fmRenderList();document.getElementById('fmInput').value='';if(c.id==='fondbot')setTimeout(()=>{c.messages.push({text:['Got it! ✨ This is a demo reply from FondBot.','I’m here 🤖 Your messages are saved in this browser.','Nice! Keep chatting — the messenger is working.'][Math.floor(Math.random()*3)],mine:false,time:fmTime()});fmSave();if(fmCurrent===c.id)fmRenderMessages();fmRenderList()},650)}
function fmPrompt(title,placeholder,callback,initial=''){const card=document.getElementById('fmStoryCard');card.innerHTML=`<h2>${fmEsc(title)}</h2><input id="fmPromptValue" maxlength="180" placeholder="${fmEsc(placeholder)}" value="${fmEsc(initial)}"><div class="story-actions"><button class="filter" id="fmCancel">Cancel</button><button class="filter" id="fmConfirm">Save</button></div>`;document.getElementById('fmStoryOverlay').classList.add('open');document.getElementById('fmCancel').onclick=()=>document.getElementById('fmStoryOverlay').classList.remove('open');document.getElementById('fmConfirm').onclick=()=>{const v=document.getElementById('fmPromptValue').value.trim();if(v){callback(v);document.getElementById('fmStoryOverlay').classList.remove('open')}}}
function fmNewChat(){fmPrompt('Добавить человека','Имя или @username',name=>{const c={id:'c'+Date.now(),name:name.replace(/^@/,'') ,emoji:'👤',avatar:'',status:'Контакт · локальный макет',isContact:true,messages:[{text:'Контакт добавлен. Для переписки с реальным человеком онлайн FondMessages понадобится сервер и аккаунты пользователей.',mine:false,time:fmTime()}]};fmChats.unshift(c);fmSave();fmRenderList();fmOpen(c.id)})}
function fmAddStory(){fmPrompt('Add a story','What would you like to share?',text=>{fmStories.unshift({id:'s'+Date.now(),name:'Your story',text,emoji:'✨',time:Date.now(),isMine:true});fmSave();fmRenderStories()})}
function fmRenderStories(){const sec=document.querySelector('.stories');if(!sec)return;sec.innerHTML=`<div class="story" id="fmYourStory"><div class="add">＋</div>Your story</div>`+fmStories.map(s=>`<div class="story" data-fm-story="${fmEsc(s.id)}">${s.avatar?`<img src="${fmEsc(s.avatar)}" alt="">`:`<div class="add">${fmEsc(s.emoji||'✨')}</div>`}<span>${fmEsc(s.name)}</span></div>`).join('');document.getElementById('fmYourStory').onclick=fmAddStory;sec.querySelectorAll('[data-fm-story]').forEach(el=>el.onclick=()=>fmViewStory(el.dataset.fmStory))}
function fmViewStory(id){const s=fmStories.find(x=>x.id===id);if(!s)return;const card=document.getElementById('fmStoryCard');card.innerHTML=`<div class="section-head"><h2>${fmEsc(s.name)}</h2><button class="circle" id="fmStoryClose">×</button></div><div class="story-art">${fmEsc(s.emoji||'✨')}</div><p>${fmEsc(s.text)}</p><div class="story-actions"><button class="filter" id="fmStoryDelete">Delete story</button></div>`;document.getElementById('fmStoryOverlay').classList.add('open');document.getElementById('fmStoryClose').onclick=()=>document.getElementById('fmStoryOverlay').classList.remove('open');document.getElementById('fmStoryDelete').onclick=()=>{fmStories=fmStories.filter(x=>x.id!==id);fmSave();fmRenderStories();document.getElementById('fmStoryOverlay').classList.remove('open')}}
function fmOptions(){const c=fmChats.find(x=>x.id===fmCurrent);if(!c)return;const card=document.getElementById('fmStoryCard');card.innerHTML=`<h2>${fmEsc(c.name)}</h2><p>Chat options</p><button class="filter" style="width:100%;margin:5px 0" id="fmRename">Rename chat</button><button class="filter" style="width:100%;margin:5px 0" id="fmExport">Download chat history</button><button class="filter" style="width:100%;margin:5px 0" id="fmDelete">Delete chat</button><div class="story-actions"><button class="filter" id="fmOptionsClose">Close</button></div>`;document.getElementById('fmStoryOverlay').classList.add('open');document.getElementById('fmOptionsClose').onclick=()=>document.getElementById('fmStoryOverlay').classList.remove('open');document.getElementById('fmRename').onclick=()=>{document.getElementById('fmStoryOverlay').classList.remove('open');fmPrompt('Rename chat','New chat name',name=>{c.name=name;fmSave();fmRenderList();fmOpen(c.id)},c.name)};document.getElementById('fmExport').onclick=()=>{const blob=new Blob([c.messages.map(m=>`[${m.time}] ${m.mine?'You':c.name}: ${m.text}`).join('\n')],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='FondMessages-history.txt';a.click();URL.revokeObjectURL(a.href)};document.getElementById('fmDelete').onclick=()=>{if(c.id==='fondbot'){alert('FondBot cannot be deleted.');return}if(confirm('Delete this chat and its messages?')){fmChats=fmChats.filter(x=>x.id!==c.id);fmSave();fmRenderList();document.getElementById('fmStoryOverlay').classList.remove('open');document.getElementById('fmChatOverlay').classList.remove('open')}}}
function searchChats(){fmEnsureUI();fmPrompt('Search chats','Type a name or message',q=>{const c=fmChats.find(x=>(x.name+' '+x.messages.map(m=>m.text).join(' ')).toLowerCase().includes(q.toLowerCase()));if(c)fmOpen(c.id);else alert('No chats found')})}

<script>
// Quick tap = tiny tactile press. A short hold = gentle iOS-like expansion.
(function(){
  const selector='.chat,.story,.circle,.filter,.nav button,.chat-compose button,.story-modal-card button';
  let active=null, timer=null;
  function clear(){
    if(timer){clearTimeout(timer);timer=null}
    if(active){active.classList.remove('fm-pressed','fm-hold');active=null}
  }
  document.addEventListener('pointerdown',function(e){
    const el=e.target.closest(selector); if(!el)return;
    clear(); active=el; el.classList.add('fm-pressed');
    timer=setTimeout(()=>{
      if(active){active.classList.remove('fm-pressed');active.classList.add('fm-hold')}
    },135);
  },{passive:true});
  document.addEventListener('pointerup',clear,{passive:true});
  document.addEventListener('pointercancel',clear,{passive:true});
  document.addEventListener('pointerout',function(e){if(active && e.target===active)clear()},{passive:true});
  document.addEventListener('click',function(e){
    const el=e.target.closest(selector);
    if(el){el.classList.remove('fm-pressed','fm-hold')}
  },{passive:true});
  window.addEventListener('blur',clear);
})();
</script>

 if(error){console.warn(error.message);return}
 const ids=[...new Set((data||[]).flatMap(m=>[m.sender_id,m.receiver_id]).filter(id=>id!==fmUser.id))];

 document.body.appendChild(gate);let login=false;const submit=gate.querySelector('.fm-register-submit');gate.querySelector('#fmLoginBtn').onclick=()=>{login=!login;gate.querySelector('#fmRegName').required=!login;gate.querySelector('#fmRegHandle').required=!login;gate.querySelector('#fmRegName').parentElement.querySelector('label').style.display=login?'none':'';gate.querySelector('#fmRegName').style.display=login?'none':'';gate.querySelector('#fmRegHandle').parentElement.previousElementSibling.style.display=login?'none':'';gate.querySelector('.fm-handle-wrap').style.display=login?'none':'';submit.innerHTML=login?'Войти <span>›</span>':'Создать аккаунт <span>›</span>';gate.querySelector('#fmLoginBtn').textContent=login?'Нет аккаунта — зарегистрироваться':'У меня уже есть аккаунт — войти'};
 gate.querySelector('#fmRegisterForm').onsubmit=async e=>{e.preventDefault();const name=gate.querySelector('#fmRegName').value.trim(),handle=gate.querySelector('#fmRegHandle').value.trim().replace(/^@/, '').toLowerCase(),email=gate.querySelector('#fmRegEmail').value.trim(),password=gate.querySelector('#fmRegPassword').value;if(!login&&(!name||!/^[a-zA-Z0-9_]{3,24}$/.test(handle))){fmNotice('Username должен содержать 3–24 латинских символа, цифры или _.');return}submit.disabled=true;submit.textContent='Подключаем…';

/* Entrance motion: gentle stagger, transform/opacity only */
.app{animation:fm-page-in .72s cubic-bezier(.22,.75,.25,1) both!important}
.top{animation:fm-content-in .62s .04s cubic-bezier(.22,.75,.25,1) both!important}
.stories{animation:fm-content-in .62s .10s cubic-bezier(.22,.75,.25,1) both!important}
.section-head{animation:fm-content-in .62s .14s cubic-bezier(.22,.75,.25,1) both!important}
#chats .chat{animation:fm-content-in .48s cubic-bezier(.22,.75,.25,1) both!important}
#chats .chat:nth-child(1){animation-delay:.07s!important}
#chats .chat:nth-child(2){animation-delay:.12s!important}
#chats .chat:nth-child(3){animation-delay:.17s!important}
#chats .chat:nth-child(4){animation-delay:.22s!important}
#chats .chat:nth-child(5){animation-delay:.27s!important}
.nav{animation:fm-nav-in .65s .18s cubic-bezier(.22,.75,.25,1) both!important}
@keyframes fm-page-in{from{opacity:.7;transform:translate3d(0,8px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes fm-content-in{from{opacity:0;transform:translate3d(0,9px,0)}to{opacity:1;transform:translate3d(0,0,0)}}
@keyframes fm-nav-in{from{opacity:0;transform:translate3d(-50%,12px,0) scale(.985)}to{opacity:1;transform:translate3d(-50%,0,0) scale(1)}}
@media(prefers-reduced-motion:reduce){.app,.top,.stories,.section-head,#chats .chat,.nav{animation:none!important}.fm-particles i{animation:none!important}}
</style>
